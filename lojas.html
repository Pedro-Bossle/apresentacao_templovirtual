      <h2 class="rt-title" id="title" style="margin-top:16px"></h2>
      <div class="notes" id="notes"></div>
      <div class="rt-nav"><button class="btn" id="bp">◀ voltar</button><button class="btn" id="bv">🗳️ votar</button><button class="btn" id="bb">⬛ preta</button><button class="btn gold" id="bn">avançar ▶</button></div>
    </div></div>`;
  const cur = mountStage($('#cur')), nxt = mountStage($('#nxt'));
  stayAwake();
  let lastQ = -1, lastI = -1;
  const c = client('a', S => {
    $('#conn').className = 'dot on'; $('#conn').textContent = 'telão ok';
    cur.set(S.i, S); if (S.i < N-1) { nxt.set(S.i+1, S); $('#nxt').classList.remove('hide'); $('#nxT').textContent = SLIDES[S.i+1].title; } else { $('#nxt').classList.add('hide'); $('#nxT').textContent = 'fim'; }
    if (S.i !== lastI) { lastI = S.i; $('#title').textContent = SLIDES[S.i].title; $('#notes').innerHTML = SLIDES[S.i].notes; $('#notes').scrollTop = 0; }
    $('#step').textContent = `${String(S.i+1).padStart(2,'0')}/${N} · ${SLIDES[S.i].vote ? 'votação · ' : ''}${SLIDES[S.i].quiz ? 'quiz · ' : ''}${S.np ? S.np + ' na presença · ' : ''}${S.black ? 'tela preta · ' : ''}${S.focus ? 'foco · ' : ''}${S.laser ? 'laser' : ''}`;
    $('#room').textContent = S.n + ' na sala';
    $('#rx').innerHTML = EMOJIS.map(e => `<span>${e}<b>${S.rx[e]||0}</b></span>`).join('');
    if (S.qs.length !== lastQ) {
      lastQ = S.qs.length;
      $('#qs').innerHTML = S.qs.length ? [...S.qs].reverse().map(q => `<div><small>slide ${q.i+1} · ${new Date(q.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</small>${esc(q.txt)}</div>`).join('') : '<p class="muted">Nenhuma ainda.</p>';
    }
    const qz = S.quiz && S.quiz[S.i];
    if (qz) { $('#bv').disabled = qz.st === 'done'; $('#bv').textContent = qz.st === 'idle' ? '❓ abrir pergunta' : qz.st === 'open' ? `❓ encerrar (${qz.n}/${S.np})` : '❓ encerrada'; }
    else { $('#bv').disabled = !S.votes[S.i]; $('#bv').textContent = S.votes[S.i] && S.votes[S.i].open ? '🗳️ fechar votação' : '🗳️ votar'; }
    $('#bb').classList.toggle('on', S.black);
  });
  const planUntil = i => SLIDES.slice(0, i+1).reduce((a,s)=>a+s.time,0);
  setInterval(() => {
    const S = c.S; if (!S) return;
    const el = (Date.now() - S.slideAt)/1000, plan = SLIDES[S.i].time;
    $('#ts').textContent = fmt(el); $('#ts').classList.toggle('over', el > plan);
    $('#tsp').textContent = `previsto ${fmt(plan)}`;
    const tot = S.started ? (Date.now() - S.started)/1000 : 0;
    const diff = S.started ? tot - planUntil(S.i - 1) - Math.min(el, plan) : 0;
    $('#tot').textContent = `total ${fmt(tot)} / ${fmt(TOTAL_PLAN)}${S.started && Math.abs(diff) >= 5 ? ' · ' + (diff > 0 ? 'atrasado ' : 'adiantado ') + fmt(Math.abs(diff)) : ''}`;
    $('#pg').style.width = Math.min(100, (S.i)/(N-1)*100) + '%';
    if (!c.alive()) { $('#conn').className = 'dot'; $('#conn').textContent = 'sem telão'; }
  }, 500);
  const send = a => c.T.send({ t:'c', k:KEY, a });
  $('#bn').onclick = () => send('next'); $('#bp').onclick = () => send('prev'); $('#bv').onclick = () => send('vote'); $('#bb').onclick = () => send('black');
  $('#clr').onclick = () => send('clearq');
  addEventListener('keydown', e => {
    if (e.target.matches('textarea,input')) return;
    if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); send('next'); }
    else if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); send('prev'); }
    else if (e.key === 'b' || e.key === 'B' || e.key === '.') send('black');
  });
}

/* ======================= PDF (usado pelo render_pdf.py) ======================= */
function viewPdf(){
  document.body.className = 'v-pdf';
  const root = $('#root');
  root.innerHTML = SLIDES.map((_, i) => `<div class="pdf-page">${slideHTML(i)}</div>`).join('');
  fillQR(root);
  const host = (META.siteUrl || 'https://www.templovirtual.app').replace(/^https?:\/\/(www\.)?/, '');
  root.querySelectorAll('[data-qr="plateia"] + .qr-cap').forEach(c => c.textContent = host);
  root.querySelectorAll('[data-vote]').forEach(box => {
    const i = [...root.children].indexOf(box.closest('.pdf-page'));
    box.innerHTML = `<div class="pdf-opts">${SLIDES[i].vote.opts.map(o => `<span>${esc(o)}</span>`).join('')}</div>`;
  });
  // quiz no PDF: vira material de estudo, com a alternativa certa marcada e a explicação
  root.querySelectorAll('[data-quiz]').forEach(box => {
    const i = +box.dataset.quiz; box.querySelector('.qopts').classList.add('done'); box.querySelector('.qexp').classList.add('on');
    box.querySelector('.qside').innerHTML = `<div class="qcount"><b>${LETTERS[SLIDES[i].quiz.ok]}</b>resposta certa</div>`;
  });
  root.querySelectorAll('[data-rank]').forEach(box => box.innerHTML = '<span class="empty">O ranking é montado ao vivo, com as respostas da turma.</span>');
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => document.body.dataset.ready = '1', 300));
}

/* ======================= INÍCIO (lançador) ======================= */
function viewInicio(){
  document.body.className = 'v-inicio';
  if (!ROOM) ROOM = store.get('tv-room-'+META.key) || rnd(6);
  if (!KEY) KEY = store.get('tv-key-'+META.key) || rnd(16, 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789');
  store.set('tv-room-'+META.key, ROOM); store.set('tv-key-'+META.key, KEY);
  const card = (tag, title, desc, v, key, qr) => `<div class="panel"><span class="tag">${tag}</span><h3>${title}</h3><p>${desc}</p>
    ${qr ? `<div class="qrbox">${qrSvg(urlFor(v,key))}</div>` : ''}
    <div class="row"><a class="btn gold" href="${urlFor(v,key)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir</a><button class="btn" data-copy="${urlFor(v,key)}">Copiar link</button></div></div>`;
  $('#root').innerHTML = `<div class="launch">
    <div class="top"><img src="${LOGO}" alt="" style="width:46px;height:46px"><div class="t"><b>${esc(BRAND)} · ${esc(META.name)}</b><span>apresentação ao vivo · ${N} slides · ~${Math.round(TOTAL_PLAN/60)} min</span></div></div>
    <h1>Sala <span class="mono" style="color:var(--gold)">${esc(ROOM)}</span></h1>
    <p class="muted">Abra o <b>telão</b> no computador ligado ao projetor (F = tela cheia). Escaneie o <b>passador</b> com o seu celular. O <b>roteiro</b> fica no notebook ou num tablet. A plateia entra pelo QR Code do telão.</p>
    ${ONLINE ? `<div class="okbox">● Modo online: celulares e telão sincronizam pela internet.</div>` :
      `<div class="warn"><b>Modo ensaio.</b> Sem Supabase configurado, tudo sincroniza só entre abas deste navegador: dá para ensaiar abrindo telão, passador e roteiro aqui. Para os celulares conectarem, preencha <code>config.js</code> com a URL e a chave pública do Supabase, aplique o <code>supabase/realtime.sql</code> e publique a página num endereço público.</div>`}
    <div class="grid">
      ${card('TELÃO', 'Telão', 'Vai no projetor. Mostra o QR Code da plateia, as reações e as votações.', 'telao', true, false)}
      ${card('PASSADOR', 'Passador', 'Seu controle no celular: avançar, laser, foco, tela preta, votar e enviar tela.', 'passador', true, true)}
      ${card('ROTEIRO', 'Roteiro', 'Notas de cada slide, cronômetro, próximo slide e as perguntas da plateia.', 'roteiro', true, false)}
      ${card('PLATEIA', 'Plateia', 'O que o público vê no celular. Não tem a chave, então não controla nada.', 'plateia', false, true)}
    </div>
    ${META.db ? `<div class="panel" style="margin-top:16px"><span class="tag">TURMA</span><h3 style="margin:4px 0 6px">Presença e notas do quiz</h3>
      <p class="muted" style="margin:0 0 10px">Quem entrou pelo celular e quanto fez no quiz de fixação desta sala. Fica salvo no banco do Templo Virtual (tabelas <code>escola_*</code>).</p>
      <div class="row"><button class="btn gold" id="rpLoad">Ver turma</button><button class="btn" id="rpCsv" disabled>Baixar planilha (CSV)</button></div>
      <div id="rpOut"></div></div>` : ''}
    <p class="muted" style="margin-top:22px">O link do passador e do roteiro tem a chave do apresentador. Não compartilhe. <button class="btn" id="newRoom" style="margin-left:8px">Nova sala</button></p>
  </div>`;
  if (META.db) {
    let rows = [];
    $('#rpLoad').onclick = async () => {
      const out = $('#rpOut');
      if (!ONLINE) { out.innerHTML = '<p class="warn">A turma só é salva no modo online (Supabase configurado).</p>'; return; }
      out.innerHTML = '<p class="muted">Carregando…</p>';
      try {
        const sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth:{ persistSession:false } });
        const { data, error } = await sb.rpc('escola_resultado', { p_sala:ROOM, p_chave:KEY });
        if (error) throw error;
        rows = data.participantes || [];
        $('#rpCsv').disabled = !rows.length;
        out.innerHTML = rows.length ? `<table class="report"><tr><th>#</th><th>Nome</th><th>Capítulo</th><th>Acertos</th><th>Pontos</th></tr>${rows.map((r,k) => `<tr><td class="n">${k+1}</td><td>${esc(r.nome)}</td><td>${esc(r.capitulo || '')}</td><td class="n">${r.acertos}/${SLIDES.filter(x=>x.quiz).length}</td><td class="n">${r.pontos}</td></tr>`).join('')}</table>`
          : '<p class="muted">Ninguém entrou nesta sala ainda.</p>';
      } catch (e) {
        out.innerHTML = `<p class="warn">Não consegui ler a turma: ${esc(e.message || e)}. Confira se o <code>supabase/escola.sql</code> foi aplicado no projeto.</p>`;
      }
    };
    $('#rpCsv').onclick = () => {
      const nq = SLIDES.filter(x=>x.quiz).length, cell = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
      const csv = ['Posição;Nome;Capítulo;Entrou em;Acertos;Perguntas;Pontos'].concat(rows.map((r,k) => [k+1, r.nome, r.capitulo || '', new Date(r.entrou_em).toLocaleString('pt-BR'), r.acertos, nq, r.pontos].map(cell).join(';'))).join('\r\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8' }));
      a.download = `${META.name} - turma ${ROOM}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-copy]'); if (!b) return;
    navigator.clipboard?.writeText(b.dataset.copy).then(() => { b.textContent = 'Copiado ✓'; setTimeout(()=> b.textContent='Copiar link', 1500); });
  });
  $('#newRoom').onclick = () => { store.set('tv-room-'+META.key,''); store.set('tv-key-'+META.key,''); location.href = BASE; };
}

if (VIEW !== 'inicio' && VIEW !== 'pdf' && !ROOM) { viewInicio(); return; }
({ telao:viewTelao, plateia:viewPlateia, passador:viewPassador, roteiro:viewRoteiro, pdf:viewPdf }[VIEW] || viewInicio)();
})();
</script>
